{% include 'rows.html' %}
{% if contacts|length == 10 %}
    <tr>
        <td colspan="5" style="text-align: center">
            <span hx-target="closest tr"
                hx-trigger="revealed"
                hx-swap="outerHTML"
                hx-select="tbody > tr"
                hx-get="/contacts?page={{ page + 1 }}">
                Loading More...
            </span>
        </td>
    </tr>
{% endif %}
