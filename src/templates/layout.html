<!doctype html>
<html lang="">
<head>
    <title>Contact App</title>
    <link rel="stylesheet" href="https://the.missing.style/v0.2.0/missing.min.css">
    <link rel="stylesheet" href="/static/site.css">
    <script src="/static/js/htmx-2.0.8.js"></script>
    <script src="/static/js/_hyperscript-0.9.14.js"></script>
    <script src="/static/js/rsjs-menu.js" type="module"></script>
    <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/alpinejs"></script>
</head>
<body hx-boost="true">
    <section class="counter" data-counter>
        <output id="my-output" data-counter-output>0</output>
        <button class="increment-btn" data-counter-increment>Increment</button>
    </section>
    <script>
        document.querySelectorAll("[data-counter]")
            .forEach(el => {
                const output = el.querySelector("[data-counter-output]")
                const incrementBtn = el.querySelector("[data-counter-increment]")
                incrementBtn.addEventListener("click", e => output.textContent++)
            })

        function overflowMenu(tree = document) {
            tree.querySelectorAll("[data-overflow-menu]").forEach(menuRoot => {
                const button = menuRoot.querySelector("[aria-haspopup]"),
                menu = menuRoot.querySelector("[role=menu]"),
                items = [...menu.querySelectorAll("[role=menuitem]")];
                const isOpen = () => !menu.hidden;
                items.forEach(item => item.setAttribute("tabindex", "-1"));

                function toggleMenu(open = !isOpen()) {
                    if (open) {
                        menu.hidden = false;
                        button.setAttribute("aria-expanded", "true");
                        items[0].focus();
                    } else {
                        menu.hidden = true;
                        button.setAttribute("aria-expanded", "false");
                    }
                }

                toggleMenu(isOpen());
                button.addEventListener("click", () => toggleMenu());
                menuRoot.addEventListener("blur", e => toggleMenu(false));

                window.addEventListener("click", function clickAway(event) {
                    if (!menuRoot.isConnected)
                        window.removeEventListener("click", clickAway);
                    if (!menuRoot.contains(event.target)) toggleMenu(false);
                });

                const currentIndex = () => {
                    const idx = items.indexOf(document.activeElement);
                    if (idx === -1) return 0;
                    return idx;
                }

                menu.addEventListener("keydown", e => {
                    if (e.key === "ArrowUp") {
                        items[currentIndex() - 1]?.focus();
                    } else if (e.key === "ArrowDown") {
                        items[currentIndex() + 1]?.focus();
                    } else if (e.key === "Space") {
                        items[currentIndex()].click();
                    } else if (e.key === "Home") {
                        items[0].focus();
                    } else if (e.key === "End") {
                        items[items.length - 1].focus();
                    } else if (e.key === "Escape") {
                        toggleMenu(false);
                        button.focus();
                    }
                });
            });
        }
        addEventListener("htmx:load", e => overflowMenu(e.target));
    </script>
<main>
    <header>
        <h1>
            <all-caps>contacts.app</all-caps>
            <sub-title>A Demo Contacts Application</sub-title>
        </h1>
    </header>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
