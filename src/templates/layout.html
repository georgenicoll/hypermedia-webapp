<!doctype html>
<html lang="">
<head>
    <title>Contact App</title>
    <link rel=stylesheet href=https://unpkg.com/missing.css@1.2.0>
    <link rel="stylesheet" href="/static/site.css">
    <script src="/static/js/htmx-2.0.8.js"></script>
    <script src="/static/js/_hyperscript-0.9.14.js"></script>
    <!--script src="/static/js/rsjs-menu.js" type="module"></script-->
    <script src="/static/js/extras.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://unpkg.com/alpinejs"></script>
</head>
<body hx-boost="true">
    <div class="counter">
        <output>0</output>
        <button _="on click
            increment the textContent of the previous <output/>">
        Increment
        </button>
    </div>
    <main>
        <header>
            <h1>
                <all-caps>contacts.app</all-caps>
                <sub-title>A Demo Contacts Application</sub-title>
            </h1>
        </header>
        {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
