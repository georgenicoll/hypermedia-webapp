{% extends 'layout.html' %}

{% block content %}
    {% include 'archive_ui.html' %}

    <form action="/contacts" method="get" class="tool-bar">
        <label for="search">Search Term</label>
        <input id="search" type="search" name="q"
            value="{{ request.args.get('q') or '' }}"
            hx-get="/contacts"
            hx-trigger="change, keyup delay:300ms changed"
            hx-target="tbody"
            hx-push-url="true"
            hx-indicator="#spinner"/>
        <img id="spinner" class="htmx-indicator"
            src="/static/img/spinning-circles.svg"
            alt="Request in Flight..."/>
        <input type="submit" value="Search"/>
    </form>

    <form x-data="{ selected: [] }">
        <template x-if="selected.length > 0">
            <div class="box info tool-bar">
                <slot x-text="selected.length"></slot>
                contacts selected

                <button type="button" class="bad bg color border"
                    @click="
                      confirm(`Delete ${selected.length} contacts?`) &&
                      htmx.ajax('DELETE', '/contacts', { source: $root, target: 'body' })
                    ">
                    Delete
                </button>
                <hr aria-orientation="vertical">
                <button type="button" @click="selected = []">Cancel</button>
            </div>
        </template>
        <table>
            <thead>
                <tr>
                    <th></th><th>First</th><th>Last</th><th>Phone</th><th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% include 'rows_and_lazy_load.html' %}
            </tbody>
        </table>
        <button
            hx-delete="/contacts"
            hx-confirm="Are you sure you want to delete these contacts?"
            hx-target="body">
            Delete Selected Contacts
        </button>
    </form>

    <div>
        <span style="float: right">
            {% if page > 1 %}
                <a href="/contacts?page={{ page - 1 }}">Previous</a>
            {% endif %}
            {% if contacts|length == 10 %}
                <a href="/contacts?page={{ page + 1 }}">Next</a>
            {% endif %}
        </span>
    </div>

    <p>
        <a href="/contacts/new">Add Contact</a>
        <span hx-get="/contacts/count" hx-trigger="revealed">
            <img id="spinner" class="htmx-indicator" src="/static/img/spinning-circles.svg"/>
        </span>
    </p>

{% endblock %}
